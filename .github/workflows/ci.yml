name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: lint, test e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Validar Fontes
        run: npm run content:check

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
